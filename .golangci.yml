version: "2"

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    rules:
      # Test helpers legitimately ignore errors from fixtures.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
